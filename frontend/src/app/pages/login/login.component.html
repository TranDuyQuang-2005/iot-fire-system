<div class="login-page">
  <form class="login-card" (ngSubmit)="login()">
    <h1>Giám sát an toàn</h1>
    <p>Đăng nhập hệ thống cảnh báo cháy</p>
    <label>Tài khoản</label>
    <input name="username" [(ngModel)]="username" required>
    <label>Mật khẩu</label>
    <input name="password" type="password" [(ngModel)]="password" required>
    <div class="notification-explanation">
      Sau khi đăng nhập, Android sẽ hỏi quyền thông báo để bạn vẫn nhận được cảnh báo cháy khi ứng dụng chạy nền hoặc đã đóng. Bạn vẫn có thể dùng ứng dụng nếu từ chối.
    </div>
    <button [disabled]="loading">{{ loading ? 'Đang đăng nhập...' : 'Đăng nhập' }}</button>
    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>
