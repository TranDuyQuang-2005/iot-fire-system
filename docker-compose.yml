services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iot-fire-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mosquitto-init:
    image: eclipse-mosquitto:2
    container_name: iot-fire-mosquitto-init
    user: "0:0"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    entrypoint: ["sh", "-c", "chown mosquitto:mosquitto /mosquitto/config/password_file && chmod 0700 /mosquitto/config/password_file"]
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-fire-mosquitto
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: iot-fire-backend
    depends_on:
      sqlserver:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=IotFireDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "IotFire"
      Jwt__Audience: "IotFireClient"
      Jwt__ExpiresMinutes: "60"
      Mqtt__Mode: "${MQTT_MODE:-local}"
      Mqtt__Host: "${MQTT_HOST:-mosquitto}"
      Mqtt__Port: "${MQTT_PORT:-1883}"
      Mqtt__UseTls: "${MQTT_USE_TLS:-false}"
      Mqtt__Username: "${MQTT_BACKEND_USERNAME}"
      Mqtt__Password: "${MQTT_BACKEND_PASSWORD}"
      SeedAdmin__Username: "${SEED_ADMIN_USERNAME:-admin}"
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD}"
      FrontendOrigin: "http://localhost:4200"
      DeviceOfflineSeconds: "10"
      CommandTimeoutSeconds: "15"
      Firebase__Enabled: "${FIREBASE_ENABLED:-false}"
      Firebase__CredentialsPath: "${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase-service-account.json}"
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID:-}"
    volumes:
      - "E:/iot-fire-secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro"
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: iot-fire-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  sql_data:
  mosquitto_data:
